name: Build transit expansion migrations

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-transit-expansion.yml
      - scripts/build-transit-sql.ts
      - package.json
      - package-lock.json
  push:
    branches:
      - feat/transit-coverage-expansion
    paths:
      - .github/workflows/build-transit-expansion.yml
      - scripts/build-transit-sql.ts
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  build-gtfs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Download and validate GTFS feeds
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/streetrise-gtfs generated-transit
          REPORT=generated-transit/build-report.txt
          : > "$REPORT"

          build_feed() {
            slug="$1"
            migration="$2"
            url="$3"
            zip="/tmp/streetrise-gtfs/${slug}.zip"
            dir="/tmp/streetrise-gtfs/${slug}"
            out="generated-transit/${migration}"

            echo "=== ${slug} ===" | tee -a "$REPORT"
            echo "source=${url}" | tee -a "$REPORT"

            if ! curl --fail --location --retry 3 --retry-delay 2 \
              --connect-timeout 20 --max-time 180 \
              --user-agent 'StreetRise GTFS importer (https://streetrise.org)' \
              "$url" -o "$zip"; then
              echo "status=DOWNLOAD_FAILED" | tee -a "$REPORT"
              echo | tee -a "$REPORT"
              return 0
            fi

            sha256sum "$zip" | tee -a "$REPORT"
            mkdir -p "$dir"
            if ! unzip -q "$zip" -d "$dir"; then
              echo "status=UNZIP_FAILED" | tee -a "$REPORT"
              echo | tee -a "$REPORT"
              return 0
            fi

            missing=0
            for required in agency.txt routes.txt stops.txt trips.txt stop_times.txt; do
              if [ ! -f "$dir/$required" ]; then
                echo "missing=${required}" | tee -a "$REPORT"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              echo "status=INVALID_GTFS" | tee -a "$REPORT"
              echo | tee -a "$REPORT"
              return 0
            fi

            echo "files=$(find "$dir" -maxdepth 1 -type f -printf '%f ' | sort)" | tee -a "$REPORT"

            # Call tsx directly. `npm run` writes its command banner to stdout,
            # which would make the captured file invalid SQL.
            if npx tsx scripts/build-transit-sql.ts "$dir" "$slug" 20260903 \
              > "$out" 2> "generated-transit/${slug}-import.log"; then
              valid_until=$(sed -n 's/^-- Active service .* feed valid until \([0-9-]*\)\.$/\1/p' "$out" | head -1)
              echo "feed_valid_until=${valid_until:-unknown}" | tee -a "$REPORT"

              # Never make a commit-ready migration from a GTFS archive whose
              # own published validity has already ended. Keep the importer log
              # and report as evidence, but discard the SQL.
              if [ -n "$valid_until" ] && [[ "$valid_until" < "2026-09-03" ]]; then
                echo "status=STALE_FEED" | tee -a "$REPORT"
                rm -f "$out"
              else
                echo "status=OK" | tee -a "$REPORT"
                echo "migration=${migration}" | tee -a "$REPORT"
                echo "bytes=$(wc -c < "$out")" | tee -a "$REPORT"
              fi
            else
              echo "status=IMPORT_FAILED" | tee -a "$REPORT"
              rm -f "$out"
            fi
            echo | tee -a "$REPORT"
          }

          # Direct agency-published feeds where they are currently fetchable.
          build_feed psta 050_seed_psta_transit.sql \
            'https://www.psta.net/latest/google_transit.zip'
          build_feed lynx 051_seed_lynx_transit.sql \
            'http://gtfsrt.golynx.com/gtfsrt/google_transit.zip'

          # Hernando's county-hosted GTFS is checked but is currently stale. It
          # intentionally uses a candidate filename and is never committed by
          # the step below unless a future county feed becomes current.
          build_feed hernando candidate_hernando_transit.sql \
            'https://media-002-us.cdn.govstack.com/hernandocounty-us/media/zkqclmfs/current-gtfs-thehernandoexpress-fl-us.zip'

          # Broward's producer URL currently responds 403. This is the latest
          # official BCT archive held by Mobility Database (mdb-330), downloaded
          # 2026-06-30 and validated there with 44 routes. Keep this URL pinned
          # to the exact archived snapshot for reproducibility.
          build_feed bct 052_seed_bct_transit.sql \
            'https://files.mobilitydatabase.org/mdb-330/mdb-330-202606300003/mdb-330-202606300003.zip'

          # Citrus Connection is the Polk County/Lakeland transit brand. Use a
          # disambiguated slug so it can never be confused with Citrus County.
          build_feed citrus_connection 053_seed_citrus_connection_transit.sql \
            'https://www.ccbusinfo.com/InfoPoint/gtfs-zip.ashx'

          echo '--- build report ---'
          cat "$REPORT"

      - name: Upload generated migrations and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-expansion-generated
          path: generated-transit/
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated feed migrations to expansion branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            050_seed_psta_transit.sql
            051_seed_lynx_transit.sql
            052_seed_bct_transit.sql
            053_seed_citrus_connection_transit.sql
          )

          for file in "${expected[@]}"; do
            test -s "generated-transit/$file" || {
              echo "Refusing to commit: missing validated migration $file" >&2
              exit 1
            }
          done

          # Hernando is intentionally excluded until its published GTFS is
          # current. A stale candidate must never reach supabase/migrations.
          if [ -e generated-transit/candidate_hernando_transit.sql ]; then
            echo 'Refusing to commit: Hernando candidate was not rejected as stale' >&2
            exit 1
          fi

          cp generated-transit/050_seed_psta_transit.sql supabase/migrations/
          cp generated-transit/051_seed_lynx_transit.sql supabase/migrations/
          cp generated-transit/052_seed_bct_transit.sql supabase/migrations/
          cp generated-transit/053_seed_citrus_connection_transit.sql supabase/migrations/

          git config user.name 'StreetRise GTFS Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/050_seed_psta_transit.sql \
                  supabase/migrations/051_seed_lynx_transit.sql \
                  supabase/migrations/052_seed_bct_transit.sql \
                  supabase/migrations/053_seed_citrus_connection_transit.sql

          if git diff --cached --quiet; then
            echo 'Validated feed migrations already match the branch.'
            exit 0
          fi

          git commit -m 'feat: add verified transit coverage feeds'
          git push origin HEAD:${{ github.head_ref }}
