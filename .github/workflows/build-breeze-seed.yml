name: Finalize Breeze Transit integration

on:
  push:
    branches:
      - feat/transit-coverage-expansion
    paths:
      - .github/workflows/build-breeze-seed.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Breeze cleanup
        run: python scripts/finalize-breeze-once.py

      - name: Commit and remove one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/build-breeze-seed.yml scripts/finalize-breeze-once.py
          git config user.name 'StreetRise Transit Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/build-transit-sql.ts src/lib/rideOptions.ts docs/transit-feed-provenance-2026-09-03.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'chore: finalize Breeze transit coverage'
          git push origin HEAD:feat/transit-coverage-expansion
