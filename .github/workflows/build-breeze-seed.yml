# One-time builder; remove after migration 055 is committed.
name: Build Breeze Transit seed

on:
  push:
    branches:
      - feat/transit-coverage-expansion
    paths:
      - .github/workflows/build-breeze-seed.yml

permissions:
  contents: write

jobs:
  build-breeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Download and validate Breeze GTFS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/breeze
          curl --fail --location --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 180 \
            --user-agent 'StreetRise GTFS importer (https://streetrise.org)' \
            'https://breezerider.tripsparkhost.com/static/google_transit.zip' \
            -o /tmp/breeze.zip
          echo '20c127087e440ccc5f0b53b31d2c7a62c37e98e1  /tmp/breeze.zip' | sha1sum -c -
          sha256sum /tmp/breeze.zip | tee /tmp/breeze-sha256.txt
          unzip -q /tmp/breeze.zip -d /tmp/breeze
          for required in agency.txt routes.txt stops.txt trips.txt stop_times.txt feed_info.txt; do
            test -s "/tmp/breeze/$required"
          done

      - name: Generate migration 055
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/build-transit-sql.ts /tmp/breeze breeze 20260903 \
            > supabase/migrations/055_seed_breeze_transit.sql \
            2> /tmp/breeze-build.log
          cat /tmp/breeze-build.log
          grep -q 'feed valid until 2026-12-04' supabase/migrations/055_seed_breeze_transit.sql
          grep -q '1310 stops, 15 routes' supabase/migrations/055_seed_breeze_transit.sql

          # Migration 054 is the canonical current-feed/one-mile derivation.
          # Remove the generator's legacy embedded 400 m backfill and invoke 054.
          sed -i '/^-- Re-derive resources.public_transit_accessible from the stops now loaded\./,$d' \
            supabase/migrations/055_seed_breeze_transit.sql
          cat >> supabase/migrations/055_seed_breeze_transit.sql <<'SQL'
          -- Recompute feed-derived accessibility using migration 054's
          -- current-feed, exactly-one-mile rule while preserving human-set TRUEs.
          SELECT public.refresh_transit_accessibility_flags();
          SQL
          grep -q 'refresh_transit_accessibility_flags' supabase/migrations/055_seed_breeze_transit.sql
          ! grep -q '<= 400' supabase/migrations/055_seed_breeze_transit.sql

      - name: Commit Breeze migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'StreetRise Transit Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/055_seed_breeze_transit.sql
          git diff --cached --stat
          git commit -m 'feat: seed Breeze Transit for Sarasota'
          git push origin HEAD:feat/transit-coverage-expansion
