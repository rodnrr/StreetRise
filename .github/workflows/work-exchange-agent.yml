# Run the work exchange agent from the GitHub web UI.
#
# The agent needs Node, and the maintainer often has no terminal. This makes it
# runnable from a phone: Actions → Work Exchange Agent → Run workflow.
#
# It is manual-only on purpose. Nothing here publishes — the agent writes to
# `work_exchange_candidates` and an admin approves at /admin/work-exchange —
# but it does spend Anthropic tokens and fetch other people's websites, so it
# should run when someone means it to.
#
# Required repository secrets (Settings → Secrets and variables → Actions,
# on the "Secrets" tab — the "Variables" tab is a different thing and this
# workflow reads secrets):
#   SUPABASE_SERVICE_ROLE_KEY   ← service role, bypasses RLS. Never commit it.
#   ANTHROPIC_API_KEY
#
# VITE_SUPABASE_URL is NOT required — it is the public project URL and the
# workflow falls back to it. Set a `VITE_SUPABASE_URL` repository variable
# only if you need to point the agent at a different project.
#
# ── Permission model ────────────────────────────────────────────────
# SUPABASE_SERVICE_ROLE_KEY is a production administrative credential: it
# bypasses RLS entirely. Anyone who can dispatch this workflow can cause
# service-role writes, so the `apply: true` boolean is NOT the security
# boundary — GitHub write access is.
#
# Dispatching requires write access to the repository. Because of that, the
# apply path runs in the `work-exchange-apply` GitHub Environment, which is
# where the real gate belongs: add required reviewers to it under
# Settings → Environments → work-exchange-apply, and every apply run then
# waits for a human approval before any secret is available to the job.
# Until you add reviewers, the environment exists but does not gate.
#
# Both environments are created automatically on first run. `work-exchange-
# dry-run` is intentionally left unprotected: a dry run writes nothing, so
# requiring an approval to look at what the agent would propose would only
# discourage looking.
#
# Scope the secret if you can: the service role is the only key that can write
# work_exchange_candidates, but nothing stops you rotating it on suspicion.
name: Work Exchange Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        default: verify
        options:
          - verify
          - discover
          - both
      apply:
        description: Write candidates to Supabase (off = dry run)
        type: boolean
        default: false
      limit:
        description: Max pages to fetch per mode
        default: '20'
      stale_days:
        description: Only verify listings unchecked for this many days
        default: '30'

# Anthropic tokens and outbound requests to provider websites — one run at a time.
concurrency:
  group: work-exchange-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A write run enters `work-exchange-apply`; a dry run enters a separate,
    # deliberately unprotected environment. Both names are non-empty on
    # purpose — an empty environment name is not a construct worth relying on
    # here, since a workflow that fails to dispatch takes away the only way to
    # run this agent without a terminal.
    environment: ${{ inputs.apply && 'work-exchange-apply' || 'work-exchange-dry-run' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fail here, with the fix, rather than 40 seconds later inside the agent
      # with a message that cannot see which of the two is missing or where it
      # was supposed to go. An empty value here almost always means the secret
      # was added somewhere the job cannot read it.
      - name: Check credentials are reachable
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing"
            echo ""
            echo "This job reads them via the secrets context, so they must be either:"
            echo "  • repository secrets — Settings → Secrets and variables → Actions"
            echo "                         → 'Secrets' tab → New repository secret"
            echo "  • or environment secrets on BOTH environments this workflow uses:"
            echo "        work-exchange-dry-run   (used when apply is off)"
            echo "        work-exchange-apply     (used when apply is on)"
            echo ""
            echo "Two things that look right but are not:"
            echo "  • Adding them under the 'Variables' tab. Variables are \$vars, not"
            echo "    \$secrets, and a service-role key does not belong in a variable —"
            echo "    variables are plaintext and readable in the UI and logs."
            echo "  • Adding them to work-exchange-apply only. A dry run never enters"
            echo "    that environment, so it sees nothing."
            echo ""
            echo "Repository secrets are the simplest choice and work for both paths."
            exit 1
          fi
          echo "Credentials present."

      - run: npm ci

      - name: Run agent
        env:
          # Not a secret: this is the public project URL, already served in the
          # deployed client bundle and visible in any network trace of the app.
          # Read an override if one is set, otherwise fall back to the live
          # project so this can never be the thing that blocks a run.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://mldatfcwnmvrmxumzxyb.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FLAGS=""
          case "${{ inputs.mode }}" in
            verify)   FLAGS="--verify" ;;
            discover) FLAGS="--discover" ;;
            both)     FLAGS="--verify --discover" ;;
          esac
          if [ "${{ inputs.apply }}" = "true" ]; then FLAGS="$FLAGS --apply"; fi
          FLAGS="$FLAGS --limit ${{ inputs.limit }} --stale-days ${{ inputs.stale_days }}"
          echo "Running: npm run agent:work -- $FLAGS"
          npm run agent:work -- $FLAGS
